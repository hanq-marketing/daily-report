name: Update Facebook Ads Dashboard Data from Google Sheet

on:
  schedule:
    - cron: '0 1 * * *' # Chạy tự động hàng ngày lúc 01:00 UTC (08:00 AM VN)
  repository_dispatch:
    types: [update-data]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fetch Data from Google Sheets & Build Dashboard
        run: |
          python scripts/fetch_sheet_data.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          git commit -m "Auto-update Dashboard from Google Sheets" || echo "No changes to commit"
          git push
